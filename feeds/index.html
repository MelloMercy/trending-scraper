<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日热点聚合 · Public Feed</title>
<meta name="description" content="国内 + 国际多源热点的跨平台聚合、共识检测与每日简报。静态 public feed，无需后端。">
<style>
  :root { --bg:#0f1117; --card:#171a23; --line:#262b38; --fg:#e6e8ee; --mut:#9aa3b2; --acc:#6ea8fe; --hot:#ff7a59; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  a { color:var(--acc); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .wrap { max-width:1180px; margin:0 auto; padding:24px 18px 64px; }
  header h1 { margin:0 0 4px; font-size:24px; }
  .meta { color:var(--mut); font-size:13px; }
  .meta b { color:var(--fg); }
  .links { margin:14px 0 4px; display:flex; gap:10px; flex-wrap:wrap; }
  .links a { border:1px solid var(--line); padding:4px 10px; border-radius:999px; font-size:13px; }
  h2 { font-size:17px; margin:30px 0 12px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  .brief { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-top:14px; }
  .brief .narrative { color:#cdd3df; }
  .topic { padding:10px 0; border-top:1px dashed var(--line); }
  .topic:first-of-type { border-top:0; }
  .topic .t { font-weight:600; }
  .tag { display:inline-block; font-size:11px; color:var(--mut); border:1px solid var(--line);
         border-radius:6px; padding:0 6px; margin-right:6px; vertical-align:1px; }
  .topic .s { color:var(--mut); font-size:13.5px; margin:2px 0 4px; }
  .topic .src { font-size:12.5px; color:var(--mut); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .col { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .col h3 { margin:0 0 8px; font-size:14.5px; display:flex; justify-content:space-between; align-items:baseline; }
  .col h3 .n { color:var(--mut); font-size:12px; font-weight:400; }
  ol { margin:0; padding-left:20px; }
  ol li { margin:5px 0; }
  .hot { color:var(--hot); font-size:11.5px; margin-left:4px; }
  .region-label { color:var(--mut); font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin:24px 0 6px; }
  footer { margin-top:40px; color:var(--mut); font-size:12.5px; }
  .err { background:#2a1416; border:1px solid #5a2b2f; color:#ffb4b4; padding:14px 16px; border-radius:10px; }
  .empty { color:var(--mut); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>每日热点聚合 · Public Feed</h1>
    <div class="meta" id="meta">加载中…</div>
    <div class="links" id="links"></div>
  </header>
  <main id="app"><p class="empty">加载 latest.json 中…</p></main>
  <footer>
    静态 public feed，由 <a href="https://github.com/MelloMercy/trending-scraper">trending-scraper</a>
    生成 · 数据为各平台公开热点，版权归原平台 / 作者。
  </footer>
</div>
<script>
const $ = (t, props={}, ...kids) => {
  const el = Object.assign(document.createElement(t), props);
  for (const k of kids) el.append(k);
  return el;
};
const safeLink = (text, url) => {
  if (typeof url === "string" && /^https?:\/\//i.test(url)) {
    return $("a", { href: url, target: "_blank", rel: "noopener", textContent: text });
  }
  return document.createTextNode(text);
};

function renderBrief(brief) {
  if (!brief || (brief.status && brief.status !== "ok" && brief.status !== "cached")) return null;
  const box = $("div", { className: "brief" });
  if (brief.narrative) box.append($("p", { className: "narrative", textContent: brief.narrative }));
  const sections = [["consensus","跨区共识"],["cn_only","国内重点"],["intl_only","国际重点"],
                    ["persistent","持续追踪"],["emerging","早期信号"]];
  for (const [key, label] of sections) {
    for (const topic of (brief[key] || [])) {
      if (!topic || !topic.title) continue;
      const t = $("div", { className: "topic" });
      const head = $("div", { className: "t" });
      head.append($("span", { className: "tag", textContent: label }));
      head.append(document.createTextNode(topic.title));
      t.append(head);
      if (topic.summary) t.append($("div", { className: "s", textContent: topic.summary }));
      const refs = [...(topic.cn_sources||[]), ...(topic.intl_sources||[])].slice(0, 4);
      if (refs.length) {
        const src = $("div", { className: "src" });
        refs.forEach((r, i) => {
          if (i) src.append(document.createTextNode(" · "));
          const label = (r.platform || "source") + (r.rank ? " #" + r.rank : "");
          src.append(safeLink(label, r.url));
        });
        t.append(src);
      }
      box.append(t);
    }
  }
  return box.children.length ? box : null;
}

function renderPlatforms(platforms, region) {
  const cols = platforms.filter(p => p.region === region && (p.items || []).length);
  if (!cols.length) return null;
  const grid = $("div", { className: "grid" });
  for (const p of cols) {
    const col = $("div", { className: "col" });
    const h = $("h3", {});
    h.append($("span", { textContent: p.name || p.id }));
    h.append($("span", { className: "n", textContent: (p.count || p.items.length) + " 条" }));
    col.append(h);
    const ol = $("ol", {});
    for (const it of p.items.slice(0, 8)) {
      const li = $("li", {});
      li.append(safeLink(it.title || "(无标题)", it.url));
      if (it.hot_value) li.append($("span", { className: "hot", textContent: "🔥" + it.hot_value }));
      ol.append(li);
    }
    col.append(ol);
    grid.append(col);
  }
  return grid;
}

function fmt(dt) { return (dt || "").replace("T", " "); }

(async function () {
  const app = document.getElementById("app");
  try {
    const res = await fetch("./latest.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();

    const s = d.summary || {};
    document.getElementById("meta").innerHTML =
      `快照 <b>${d.snapshot_date || "?"}</b> · ${s.platforms || 0} 平台 · ${s.items || 0} 条` +
      (d.generated_at ? ` · 生成于 ${fmt(d.generated_at)}` : "");
    const links = document.getElementById("links");
    for (const [t, href] of [["全部 JSON","./latest.json"],["国内","./latest-cn.json"],
                             ["国际","./latest-intl.json"],["RSS","./latest.xml"]]) {
      links.append($("a", { href, textContent: t }));
    }

    app.replaceChildren();
    const brief = renderBrief(d.brief);
    if (brief) { app.append($("h2", { textContent: "📋 今日简报" })); app.append(brief); }
    else { app.append($("p", { className: "empty", textContent: "（今日暂无缓存简报；下方为各平台榜单）" })); }

    for (const [region, label] of [["cn","国内"],["intl","国际"]]) {
      const grid = renderPlatforms(d.platforms || [], region);
      if (grid) { app.append($("div", { className: "region-label", textContent: label })); app.append(grid); }
    }
  } catch (e) {
    app.replaceChildren($("div", { className: "err",
      textContent: "加载 latest.json 失败：" + e.message + "（本页需与 latest.json 同目录，通过 http(s) 访问）" }));
  }
})();
</script>
</body>
</html>
